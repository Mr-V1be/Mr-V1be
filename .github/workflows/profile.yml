name: Profile

on:
  push:
    branches: [main]
    paths:
      - "profile/**"
      - "src/**"
      - "assets/fonts/**"
      - "assets/projects/**"
      - "package.json"
      - "pnpm-lock.yaml"
  schedule:
    # An odd minute avoids the top-of-the-hour queue where scheduled runs get delayed or dropped.
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  readme:
    name: README and images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit regenerated files
        run: |
          if git diff --quiet -- README.md assets/generated; then
            echo "Nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/generated
          git commit -m "chore(profile): regenerate README and images"
          git push

  contributions:
    name: Contribution graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      # A separate branch keeps the daily graph out of the main history.
      - name: Publish to the output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output publish
          cp -r profile-3d-contrib publish/
          cd publish
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore(profile): refresh contribution graph"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
