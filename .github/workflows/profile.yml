name: Profile

on:
  push:
    branches: [main]
    paths:
      - "profile/**"
      - "src/**"
      - "assets/fonts/**"
      - "assets/projects/**"
      - "package.json"
      - "pnpm-lock.yaml"
  schedule:
    # An odd minute avoids the top-of-the-hour queue where scheduled runs get delayed or dropped.
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  readme:
    name: README and images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit regenerated files
        run: |
          if git diff --quiet -- README.md assets/generated; then
            echo "Nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/generated
          git commit -m "chore(profile): regenerate README and images"
          git push
      # Live images go to their own branch, named in profile.yaml, so the daily refresh stays out of the main history.
      - name: Publish live images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=$(node --input-type=module -e "import { parse } from 'yaml'; import { readFileSync } from 'node:fs'; console.log(parse(readFileSync('profile/profile.yaml', 'utf8')).activity.branch)")
          TARGET="${RUNNER_TEMP}/live-branch"
          mkdir -p "$TARGET" && cp -r live "$TARGET/"
          cd "$TARGET"
          git init -q -b "$BRANCH"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore(profile): refresh live images"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
